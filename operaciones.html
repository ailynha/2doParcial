<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ingresa tus datos: </h1>
    <script>
        let N1=Number(prompt(`Introduce el primer numero`));
        let N2=Number(prompt(`Introduce el segundo numero`));
        resta=N1-N2;
        multiplicacion=N1*N2;
        divicion=N1/N2;
        document.write("El valor de la resta es: "+resta+"<br>");
        document.write("El valor de la multiplicación es: "+multiplicacion+"<br>");
        document.write("El valor de la divicion es: "+divicion+"<br>");
    </script>
</body>
</html>
